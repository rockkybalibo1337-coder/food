<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#ffffff"/>
  <title>Calorie Counter</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --g:#2D6A4F;--gl:#52B788;--gf:#F0FAF3;--gp:#D8F3DC;
      --am:#C96A1A;--ap:#FEF3E2;--pu:#6B4FA0;--pp:#EDE7F6;
      --bl:#1A6EC9;--bp:#E7F0FE;--rd:#C93030;
      --tx:#181825;--t2:#50506A;--t3:#9898B0;
      --br:#E8E8F0;--b2:#D0D0DF;
      --bg:#F5F5FA;--wh:#FFFFFF;
      --r:16px;--rs:10px;
      --sh:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
      --fn:'DM Sans',sans-serif;--mo:'DM Mono',monospace
    }
    html,body{height:100%;background:var(--bg);font-family:var(--fn);color:var(--tx);overflow-x:hidden}
    .navbar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--br);display:flex;align-items:center;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
    .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--t3);font-family:var(--fn);font-size:10px;font-weight:500;padding:4px 12px;border-radius:10px;transition:color .15s}
    .nav-btn .ni{font-size:22px;line-height:1}
    .nav-btn.active{color:var(--g)}
    .hdr{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--br);padding:14px 20px 12px}
    .hdr-in{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
    .hdr h1{font-size:19px;font-weight:600;letter-spacing:-.4px}
    .hdr-sub{font-size:12px;color:var(--t3)}
    .page{display:none}
    .page.active{display:block}
    .main{max-width:480px;margin:0 auto;padding:16px 14px 100px}
    .card{background:var(--wh);border:1px solid var(--br);border-radius:var(--r);padding:15px 17px;margin-bottom:14px;box-shadow:var(--sh)}
    .clabel{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--t3);margin-bottom:12px}
    /* totals */
    .tot-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .tot-stat{background:var(--bg);border-radius:var(--rs);padding:10px 12px}
    .tot-stat.kcal{background:var(--gf)}
    .ts-lb{font-size:11px;color:var(--t3);font-weight:500;margin-bottom:2px}
    .ts-vl{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.5px}
    .tot-stat.kcal .ts-vl{color:var(--g)}
    .ts-un{font-size:11px;font-weight:400;color:var(--t3)}
    /* meal tabs */
    .mtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
    .mtab{padding:8px 4px;font-size:12px;font-weight:600;border:1.5px solid var(--br);border-radius:var(--rs);background:var(--wh);color:var(--t2);cursor:pointer;transition:all .15s;text-align:center;font-family:var(--fn)}
    .mtab .ti{display:block;font-size:16px;margin-bottom:1px}
    .mtab.active.breakfast{background:var(--ap);border-color:var(--am);color:var(--am)}
    .mtab.active.lunch{background:var(--gf);border-color:var(--gl);color:var(--g)}
    .mtab.active.dinner{background:var(--pp);border-color:var(--pu);color:var(--pu)}
    /* search box */
    .search-wrap{position:relative;margin-bottom:12px}
    .search-wrap input{width:100%;padding:11px 13px 11px 38px;font-size:14px;font-family:var(--fn);border:1.5px solid var(--br);border-radius:var(--rs);background:var(--bg);color:var(--tx);outline:none;transition:border-color .15s;-webkit-appearance:none}
    .search-wrap input:focus{border-color:var(--gl);background:var(--wh);box-shadow:0 0 0 3px rgba(82,183,136,.12)}
    .search-wrap input::placeholder{color:var(--t3);font-size:14px}
    .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
    .search-results{background:var(--wh);border:1px solid var(--br);border-radius:var(--rs);margin-top:-6px;margin-bottom:10px;box-shadow:var(--sh);max-height:260px;overflow-y:auto;display:none}
    .search-results.show{display:block}
    .sr-item{padding:10px 13px;border-bottom:1px solid var(--br);cursor:pointer;transition:background .12s;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .sr-item:last-child{border-bottom:none}
    .sr-item:hover{background:var(--gf)}
    .sr-left{flex:1;min-width:0}
    .sr-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sr-meta{font-size:11px;color:var(--t3);margin-top:1px}
    .sr-flag{font-size:14px;flex-shrink:0}
    /* mode toggle */
    .mode-toggle{display:flex;gap:6px;margin-bottom:12px}
    .mode-btn{flex:1;padding:8px;font-size:12px;font-weight:600;border:1.5px solid var(--br);border-radius:var(--rs);background:var(--wh);color:var(--t2);cursor:pointer;transition:all .15s;font-family:var(--fn);text-align:center}
    .mode-btn.active{background:var(--tx);color:var(--wh);border-color:var(--tx)}
    /* quick add panel */
    .quick-panel{display:none}
    .quick-panel.show{display:block}
    .selected-food-card{background:var(--gf);border:1px solid var(--gp);border-radius:var(--rs);padding:11px 13px;margin-bottom:10px}
    .sfc-name{font-size:14px;font-weight:600;color:var(--g)}
    .sfc-meta{font-size:12px;color:var(--t2);margin-top:3px;font-family:var(--mo)}
    .profile-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
    .profile-btn{padding:12px 10px;border:1.5px solid var(--br);border-radius:var(--rs);background:var(--wh);cursor:pointer;font-family:var(--fn);transition:all .15s;text-align:center}
    .profile-btn:hover{border-color:var(--gl)}
    .profile-btn .pb-icon{font-size:22px;display:block;margin-bottom:4px}
    .profile-btn .pb-label{font-size:12px;font-weight:600;color:var(--t2)}
    .profile-btn .pb-info{font-size:11px;color:var(--t3);margin-top:1px}
    .profile-btn .pb-kcal{font-size:13px;font-weight:700;color:var(--g);margin-top:3px}
    /* gram panel */
    .gram-panel{display:none}
    .gram-panel.show{display:block}
    .igrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
    .ifl{grid-column:1/-1}
    .iw label{display:block;font-size:11px;font-weight:600;color:var(--t3);margin-bottom:4px}
    .iw input{width:100%;padding:10px 12px;font-size:15px;font-family:var(--fn);border:1.5px solid var(--br);border-radius:var(--rs);background:var(--bg);color:var(--tx);outline:none;transition:border-color .15s;-webkit-appearance:none}
    .iw input:focus{border-color:var(--gl);background:var(--wh);box-shadow:0 0 0 3px rgba(82,183,136,.12)}
    .iw input::placeholder{color:var(--t3);font-size:13px}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    input[type=number]{-moz-appearance:textfield}
    .gram-preview{background:var(--bg);border-radius:var(--rs);padding:9px 12px;margin-bottom:10px;display:none;font-size:12px;color:var(--t2);font-family:var(--mo)}
    .gram-preview.show{display:block}
    .abtn{width:100%;padding:13px;font-size:15px;font-weight:600;font-family:var(--fn);background:var(--g);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;transition:background .15s,transform .1s}
    .abtn:hover{background:#1f4d39}
    .abtn:active{transform:scale(.98)}
    /* meal sections */
    .msec{margin-bottom:16px}
    .mshdr{display:flex;align-items:center;justify-content:space-between;padding:0 2px;margin-bottom:7px}
    .mstit{display:flex;align-items:center;gap:7px}
    .mdot{width:7px;height:7px;border-radius:50%}
    .mdot.breakfast{background:var(--am)}
    .mdot.lunch{background:var(--gl)}
    .mdot.dinner{background:var(--pu)}
    .msname{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--t2)}
    .mskcal{font-size:12px;font-weight:600;color:var(--t3)}
    .mskcal.breakfast{color:var(--am)}
    .mskcal.lunch{color:var(--g)}
    .mskcal.dinner{color:var(--pu)}
    .eitem{background:var(--wh);border:1px solid var(--br);border-radius:var(--rs);padding:10px 13px;margin-bottom:5px;display:flex;align-items:center;gap:9px;box-shadow:var(--sh);animation:fu .2s ease}
    @keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .elft{flex:1;min-width:0}
    .ename{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .emac{font-size:11px;color:var(--t3);margin-top:2px;font-family:var(--mo)}
    .ekcal{font-size:14px;font-weight:600;color:var(--tx);flex-shrink:0}
    .ekcal span{font-size:10px;font-weight:400;color:var(--t3)}
    .dbtn{background:none;border:none;cursor:pointer;color:var(--b2);font-size:13px;padding:4px;transition:color .15s}
    .dbtn:hover{color:var(--rd)}
    .emty{font-size:13px;color:var(--t3);padding:7px 11px;border:1.5px dashed var(--br);border-radius:var(--rs);text-align:center}
    /* history */
    .ptabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
    .ptabs::-webkit-scrollbar{display:none}
    .ptab{flex-shrink:0;padding:7px 15px;font-size:13px;font-weight:600;border:1.5px solid var(--br);border-radius:99px;background:var(--wh);color:var(--t2);cursor:pointer;transition:all .15s;font-family:var(--fn)}
    .ptab.active{background:var(--tx);color:var(--wh);border-color:var(--tx)}
    .bchart{display:flex;align-items:flex-end;gap:4px;height:80px;margin-bottom:6px}
    .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
    .bwrap{width:100%;display:flex;align-items:flex-end;height:64px}
    .bfill{width:100%;border-radius:4px 4px 0 0;background:var(--gp);transition:height .3s ease;min-height:2px}
    .bfill.today{background:var(--gl)}
    .blbl{font-size:10px;color:var(--t3);font-weight:500}
    .hday{border-bottom:1px solid var(--br);padding:12px 0}
    .hday:last-child{border-bottom:none}
    .hd-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
    .hd-dt{font-size:14px;font-weight:600;color:var(--tx)}
    .hd-kc{font-size:14px;font-weight:700;color:var(--g)}
    .hd-mc{font-size:12px;color:var(--t3);font-family:var(--mo)}
    .htag{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;border-radius:99px;margin-left:6px}
    .htag.today{background:var(--gp);color:var(--g)}
    .htag.yesterday{background:var(--bp);color:var(--bl)}
    .srow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
    .sbox{background:var(--bg);border-radius:var(--rs);padding:10px 11px;text-align:center}
    .sbox .sv{font-size:17px;font-weight:700;color:var(--tx);letter-spacing:-.3px}
    .sbox .sl{font-size:11px;color:var(--t3);font-weight:500;margin-top:2px}
    .div{height:1px;background:var(--br);margin:4px 0 14px}
    /* projection */
    .phero{background:linear-gradient(135deg,#1f4d39 0%,#2D6A4F 60%,#52B788 100%);border-radius:var(--r);padding:22px 18px;margin-bottom:14px;color:#fff}
    .phlb{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;opacity:.7;margin-bottom:7px}
    .phvl{font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1}
    .phun{font-size:15px;font-weight:400;opacity:.8;margin-left:3px}
    .phsb{font-size:13px;opacity:.75;margin-top:7px}
    .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
    .pstat{background:var(--wh);border:1px solid var(--br);border-radius:var(--rs);padding:12px 13px;box-shadow:var(--sh)}
    .pstat .psl{font-size:11px;color:var(--t3);font-weight:600;margin-bottom:4px}
    .pstat .psv{font-size:19px;font-weight:700;color:var(--tx);letter-spacing:-.4px}
    .pstat .psu{font-size:11px;color:var(--t3)}
    .icard{background:var(--wh);border:1px solid var(--br);border-radius:var(--r);padding:14px 16px;margin-bottom:9px;box-shadow:var(--sh);display:flex;gap:13px;align-items:flex-start}
    .iico{font-size:22px;line-height:1;flex-shrink:0}
    .itit{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:3px}
    .ibod{font-size:13px;color:var(--t2);line-height:1.5}
    .ival{font-weight:700;color:var(--g)}
    .nodata{text-align:center;padding:50px 20px;color:var(--t3)}
    .nodata .ndi{font-size:38px;margin-bottom:10px}
    .nodata .ndt{font-size:14px;line-height:1.6}
    .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--tx);color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.2)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    /* category header in search */
    .sr-cat{padding:6px 13px 3px;font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--t3);background:var(--bg)}
    /* gram input live feedback */
    .grams-row{display:flex;gap:8px;align-items:flex-end}
    .grams-row .iw{flex:1}
    .calc-btn{padding:10px 14px;background:var(--gf);border:1.5px solid var(--gp);border-radius:var(--rs);font-size:13px;font-weight:600;color:var(--g);cursor:pointer;font-family:var(--fn);white-space:nowrap;transition:background .15s}
    .calc-btn:hover{background:var(--gp)}
    .no-db-msg{font-size:13px;color:var(--t3);text-align:center;padding:14px}
  </style>
</head>
<body>

<div class="hdr">
  <div class="hdr-in">
    <h1 id="pgTitle">Today</h1>
    <span class="hdr-sub" id="hdrDate"></span>
  </div>
</div>

<!-- ═══ TODAY ═══ -->
<div class="page active" id="page-today">
  <div class="main">
    <div class="card">
      <div class="clabel">Daily Total</div>
      <div class="tot-grid">
        <div class="tot-stat kcal"><div class="ts-lb">Calories</div><div class="ts-vl" id="tKcal">0 <span class="ts-un">kcal</span></div></div>
        <div class="tot-stat"><div class="ts-lb">Protein</div><div class="ts-vl" id="tProt">0 <span class="ts-un">g</span></div></div>
        <div class="tot-stat"><div class="ts-lb">Fat</div><div class="ts-vl" id="tFat">0 <span class="ts-un">g</span></div></div>
        <div class="tot-stat"><div class="ts-lb">Carbs</div><div class="ts-vl" id="tCarbs">0 <span class="ts-un">g</span></div></div>
      </div>
    </div>

    <div class="card">
      <div class="clabel">Add Food</div>
      <div class="mtabs">
        <button class="mtab breakfast active" data-meal="breakfast" onclick="selMeal('breakfast')"><span class="ti">🌅</span>Breakfast</button>
        <button class="mtab lunch" data-meal="lunch" onclick="selMeal('lunch')"><span class="ti">☀️</span>Lunch</button>
        <button class="mtab dinner" data-meal="dinner" onclick="selMeal('dinner')"><span class="ti">🌙</span>Dinner</button>
      </div>

      <!-- Search -->
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="foodSearch" type="text" placeholder="Search food database…" autocomplete="off" oninput="onSearch(this.value)" onfocus="onSearch(this.value)"/>
      </div>
      <div class="search-results" id="searchResults"></div>

      <!-- Mode toggle -->
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeQuick" onclick="setMode('quick')">⚡ Quick Add</button>
        <button class="mode-btn" id="modeGram" onclick="setMode('gram')">📏 By Grams</button>
        <button class="mode-btn" id="modeManual" onclick="setMode('manual')">✏️ Manual</button>
      </div>

      <!-- QUICK ADD PANEL -->
      <div class="quick-panel show" id="quickPanel">
        <div id="selectedFoodCard" class="selected-food-card" style="display:none"></div>
        <div id="noFoodMsg" class="no-db-msg">Search and select a food above to quick-add</div>
        <div class="profile-btns" id="profileBtns" style="display:none">
          <button class="profile-btn" onclick="quickAdd('male')">
            <span class="pb-icon">👨</span>
            <span class="pb-label">Male portion</span>
            <span class="pb-info">195 cm · 120 kg</span>
            <span class="pb-kcal" id="malePortion">—</span>
          </button>
          <button class="profile-btn" onclick="quickAdd('female')">
            <span class="pb-icon">👩</span>
            <span class="pb-label">Female portion</span>
            <span class="pb-info">168 cm · 60 kg</span>
            <span class="pb-kcal" id="femalePortion">—</span>
          </button>
        </div>
      </div>

      <!-- GRAM PANEL -->
      <div class="gram-panel" id="gramPanel">
        <div id="gramFoodCard" class="selected-food-card" style="display:none"></div>
        <div id="noGramMsg" class="no-db-msg">Search and select a food above, then enter grams</div>
        <div id="gramInputArea" style="display:none">
          <div class="grams-row">
            <div class="iw"><label>Grams / amount</label><input id="gramInput" type="number" placeholder="e.g. 150" min="1" inputmode="decimal" oninput="updateGramPreview()"/></div>
            <button class="calc-btn" onclick="addByGrams()">Add ＋</button>
          </div>
          <div class="gram-preview" id="gramPreview"></div>
        </div>
      </div>

      <!-- MANUAL PANEL -->
      <div class="gram-panel" id="manualPanel">
        <div class="igrid">
          <div class="iw ifl"><label>Food name</label><input id="manName" type="text" placeholder="e.g. Grilled chicken" autocomplete="off"/></div>
          <div class="iw ifl"><label>Calories (kcal)</label><input id="manCal" type="number" placeholder="0" min="0" inputmode="decimal"/></div>
          <div class="iw"><label>Protein (g)</label><input id="manProt" type="number" placeholder="0" inputmode="decimal"/></div>
          <div class="iw"><label>Fat (g)</label><input id="manFat" type="number" placeholder="0" inputmode="decimal"/></div>
          <div class="iw ifl"><label>Carbohydrates (g)</label><input id="manCarbs" type="number" placeholder="0" inputmode="decimal"/></div>
        </div>
        <button class="abtn" onclick="addManual()">+ Add to Log</button>
      </div>
    </div>
    <div id="mealSecs"></div>
  </div>
</div>

<!-- ═══ HISTORY ═══ -->
<div class="page" id="page-history">
  <div class="main">
    <div class="ptabs" id="ptabs">
      <button class="ptab active" data-p="7" onclick="setPeriod(7)">7 days</button>
      <button class="ptab" data-p="14" onclick="setPeriod(14)">2 weeks</button>
      <button class="ptab" data-p="30" onclick="setPeriod(30)">Month</button>
      <button class="ptab" data-p="90" onclick="setPeriod(90)">3 months</button>
      <button class="ptab" data-p="365" onclick="setPeriod(365)">Year</button>
    </div>
    <div id="histCont"></div>
  </div>
</div>

<!-- ═══ FORECAST ═══ -->
<div class="page" id="page-projection">
  <div class="main" id="projCont"></div>
</div>

<div class="navbar">
  <button class="nav-btn active" data-page="today" onclick="goPage('today')"><span class="ni">🥗</span>Today</button>
  <button class="nav-btn" data-page="history" onclick="goPage('history')"><span class="ni">📊</span>History</button>
  <button class="nav-btn" data-page="projection" onclick="goPage('projection')"><span class="ni">🔮</span>Forecast</button>
</div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
// FOOD DATABASE
// per100: [kcal, protein, fat, carbs]
// maleG / femaleG: quick-add grams
// unit: display unit (for fixed-portion items like 'piece','serving','bowl')
// fixedG: if item is fixed portion, grams equivalent for nutrition calc
// ══════════════════════════════════════════════
const DB = [

// ─── COMMON PROTEINS ───
{id:'c1', name:'Chicken breast, boiled', cat:'🍗 Proteins', flag:'', per100:[165,31,3.6,0], maleG:220, femaleG:140},
{id:'c2', name:'Chicken breast, baked/grilled', cat:'🍗 Proteins', flag:'', per100:[165,31,3.6,0], maleG:200, femaleG:130},
{id:'c3', name:'Chicken breast, fried (breaded)', cat:'🍗 Proteins', flag:'', per100:[219,29,10,2], maleG:200, femaleG:130},

const searchIndex = DB.map(item => ({
  ...item,
  _search: (item.name + ' ' + item.cat).toLowerCase()
}));

// ══════════════════════════════════════════════
// APP STATE
// ══════════════════════════════════════════════
const SK = 'cal_v5';
function load(){try{return JSON.parse(localStorage.getItem(SK)||'[]')}catch{return[]}}
function save(d){localStorage.setItem(SK,JSON.stringify(d))}
let entries = load();
let activeMeal = 'breakfast';
let activePeriod = 7;
let addMode = 'quick'; // 'quick' | 'gram' | 'manual'
let selectedFood = null; // currently selected food from DB

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
function fmt(v, d=1){ const n=parseFloat(v)||0; return d===0?Math.round(n):parseFloat(n.toFixed(d)); }
function fmtN(n){ return n>=1000?(n/1000).toFixed(1)+'k':Math.round(n)+''; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function dStr(d){ return d.toISOString().slice(0,10); }
function sumK(arr,k){ return arr.reduce((s,e)=>s+(parseFloat(e[k])||0),0); }
function byDate(arr){ const g={}; arr.forEach(e=>{if(!g[e.date])g[e.date]=[];g[e.date].push(e)}); return g; }
function pastDates(n){ const r=[]; for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);r.push(dStr(d))} return r; }
function fmtDate(s){ const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function macrosFromGrams(item, g){
  const f = g/100;
  return { cal: item.per100[0]*f, prot: item.per100[1]*f, fat: item.per100[2]*f, carbs: item.per100[3]*f };
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// ══════════════════════════════════════════════
// SEARCH
// ══════════════════════════════════════════════
function onSearch(q){
  const sr = document.getElementById('searchResults');
  if(!q || q.trim().length < 1){ sr.classList.remove('show'); return; }
  const qL = q.toLowerCase();
  const hits = searchIndex.filter(i => i._search.includes(qL)).slice(0, 30);
  if(!hits.length){ sr.innerHTML='<div class="no-db-msg">No results found</div>'; sr.classList.add('show'); return; }

  // Group by category
  const cats = {};
  hits.forEach(h => { if(!cats[h.cat]) cats[h.cat]=[]; cats[h.cat].push(h); });

  let html='';
  Object.entries(cats).forEach(([cat, items]) => {
    html += `<div class="sr-cat">${cat}</div>`;
    items.forEach(item => {
      const per = item.fixedG
        ? `${Math.round(item.per100[0]*item.fixedG/100)} kcal / ${item.unit||'serving'}`
        : `${item.per100[0]} kcal/100g`;
      html += `<div class="sr-item" onclick="selectFood('${item.id}')">
        <div class="sr-left">
          <div class="sr-name">${item.name}</div>
          <div class="sr-meta">${per} · P${item.per100[1]}g F${item.per100[2]}g C${item.per100[3]}g</div>
        </div>
        <span class="sr-flag">${item.flag||''}</span>
      </div>`;
    });
  });
  sr.innerHTML = html;
  sr.classList.add('show');
}

function selectFood(id){
  selectedFood = DB.find(i => i.id === id);
  document.getElementById('searchResults').classList.remove('show');
  document.getElementById('foodSearch').value = selectedFood.name;
  updateSelectedFoodUI();
}

function updateSelectedFoodUI(){
  if(!selectedFood) return;
  const item = selectedFood;
  const isFixed = !!item.fixedG;
  const baseG = item.fixedG || 100;
  const kcalBase = Math.round(item.per100[0]*baseG/100);
  const baseLabel = isFixed ? `per ${item.unit||'serving'} (${baseG}g)` : 'per 100g';

  // Quick panel
  const sfc = document.getElementById('selectedFoodCard');
  const noFoodMsg = document.getElementById('noFoodMsg');
  const profileBtns = document.getElementById('profileBtns');

  sfc.style.display='block';
  sfc.innerHTML=`<div class="sfc-name">${item.flag||''} ${item.name}</div>
    <div class="sfc-meta">${kcalBase} kcal · P${fmt(item.per100[1]*baseG/100)}g · F${fmt(item.per100[2]*baseG/100)}g · C${fmt(item.per100[3]*baseG/100)}g &nbsp;(${baseLabel})</div>`;
  noFoodMsg.style.display='none';
  profileBtns.style.display='grid';

  // Calculate male/female quick portions
  const mg = item.maleG; const fg = item.femaleG;
  const mK = Math.round(item.per100[0]*mg/100);
  const fK = Math.round(item.per100[0]*fg/100);
  document.getElementById('malePortion').textContent = `${mK} kcal (${mg}${item.unit&&item.fixedG?'×':item.unit||'g'})`;
  document.getElementById('femalePortion').textContent = `${fK} kcal (${fg}${item.unit&&item.fixedG?'×':item.unit||'g'})`;

  // Gram panel
  const gfc = document.getElementById('gramFoodCard');
  const noGramMsg = document.getElementById('noGramMsg');
  const gramInputArea = document.getElementById('gramInputArea');
  gfc.style.display='block';
  gfc.innerHTML=sfc.innerHTML;
  noGramMsg.style.display='none';
  gramInputArea.style.display='block';
  document.getElementById('gramInput').value='';
  document.getElementById('gramPreview').classList.remove('show');
}

function updateGramPreview(){
  if(!selectedFood) return;
  const g = parseFloat(document.getElementById('gramInput').value)||0;
  const prev = document.getElementById('gramPreview');
  if(!g){ prev.classList.remove('show'); return; }
  const m = macrosFromGrams(selectedFood, g);
  prev.textContent = `→ ${Math.round(m.cal)} kcal · P ${fmt(m.prot)}g · F ${fmt(m.fat)}g · C ${fmt(m.carbs)}g`;
  prev.classList.add('show');
}

// ══════════════════════════════════════════════
// ADD MODES
// ══════════════════════════════════════════════
function setMode(m){
  addMode = m;
  document.getElementById('modeQuick').classList.toggle('active', m==='quick');
  document.getElementById('modeGram').classList.toggle('active', m==='gram');
  document.getElementById('modeManual').classList.toggle('active', m==='manual');
  document.getElementById('quickPanel').classList.toggle('show', m==='quick');
  document.getElementById('gramPanel').classList.toggle('show', m==='gram');
  document.getElementById('manualPanel').classList.toggle('show', m==='manual');
}

function quickAdd(profile){
  if(!selectedFood){ toast('Select a food first'); return; }
  const item = selectedFood;
  const g = profile==='male' ? item.maleG : item.femaleG;
  const m = macrosFromGrams(item, g);
  const label = profile==='male' ? '(👨 male)' : '(👩 female)';
  pushEntry(item.name+' '+label, m.cal, m.prot, m.fat, m.carbs);
  clearSearch();
}

function addByGrams(){
  if(!selectedFood){ toast('Select a food first'); return; }
  const g = parseFloat(document.getElementById('gramInput').value)||0;
  if(!g){ toast('Enter amount in grams'); return; }
  const m = macrosFromGrams(selectedFood, g);
  pushEntry(selectedFood.name, m.cal, m.prot, m.fat, m.carbs);
  document.getElementById('gramInput').value='';
  document.getElementById('gramPreview').classList.remove('show');
  clearSearch();
}

function addManual(){
  const name = document.getElementById('manName').value.trim();
  const cal = document.getElementById('manCal').value;
  if(!name){ toast('Enter a food name'); return; }
  if(cal===''){ toast('Enter calories'); return; }
  pushEntry(name, parseFloat(cal)||0,
    parseFloat(document.getElementById('manProt').value)||0,
    parseFloat(document.getElementById('manFat').value)||0,
    parseFloat(document.getElementById('manCarbs').value)||0);
  ['manName','manCal','manProt','manFat','manCarbs'].forEach(id=>document.getElementById(id).value='');
}

function clearSearch(){
  document.getElementById('foodSearch').value='';
  document.getElementById('searchResults').classList.remove('show');
  selectedFood=null;
  document.getElementById('selectedFoodCard').style.display='none';
  document.getElementById('noFoodMsg').style.display='block';
  document.getElementById('profileBtns').style.display='none';
  document.getElementById('gramFoodCard').style.display='none';
  document.getElementById('noGramMsg').style.display='block';
  document.getElementById('gramInputArea').style.display='none';
}

function pushEntry(name, cal, prot, fat, carbs){
  entries.push({ id:Date.now(), date:todayStr(), meal:activeMeal, name,
    calories:parseFloat(cal)||0, protein:parseFloat(prot)||0,
    fat:parseFloat(fat)||0, carbs:parseFloat(carbs)||0 });
  save(entries); renderToday();
  toast('Added to '+activeMeal.charAt(0).toUpperCase()+activeMeal.slice(1));
}

function delEntry(id){ entries=entries.filter(e=>e.id!==id); save(entries); renderToday(); }

// ══════════════════════════════════════════════
// PAGES
// ══════════════════════════════════════════════
function goPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  document.getElementById('pgTitle').textContent={today:'Today',history:'History',projection:'Forecast'}[p];
  if(p==='history') renderHistory();
  if(p==='projection') renderProjection();
}

function selMeal(m){ activeMeal=m; document.querySelectorAll('.mtab').forEach(b=>b.classList.toggle('active',b.dataset.meal===m)); }

function renderToday(){
  const today=entries.filter(e=>e.date===todayStr());
  const mk=v=>fmt(v)+' <span class="ts-un">kcal</span>';
  const mg=v=>fmt(v)+' <span class="ts-un">g</span>';
  document.getElementById('tKcal').innerHTML=mk(sumK(today,'calories'));
  document.getElementById('tProt').innerHTML=mg(sumK(today,'protein'));
  document.getElementById('tFat').innerHTML=mg(sumK(today,'fat'));
  document.getElementById('tCarbs').innerHTML=mg(sumK(today,'carbs'));
  const MEALS=['breakfast','lunch','dinner'];
  const LBL={breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner'};
  document.getElementById('mealSecs').innerHTML=MEALS.map(meal=>{
    const list=today.filter(e=>e.meal===meal);
    const mKcal=fmt(sumK(list,'calories'));
    const has=list.length>0;
    const items=has?list.map(e=>{
      const mac=[e.protein?`P${fmt(e.protein)}g`:null,e.fat?`F${fmt(e.fat)}g`:null,e.carbs?`C${fmt(e.carbs)}g`:null].filter(Boolean).join(' · ');
      return `<div class="eitem"><div class="elft"><div class="ename">${e.name}</div>${mac?`<div class="emac">${mac}</div>`:''}</div><div class="ekcal">${fmt(e.calories)} <span>kcal</span></div><button class="dbtn" onclick="delEntry(${e.id})">✕</button></div>`;
    }).join(''):`<div class="emty">No entries yet</div>`;
    return `<div class="msec"><div class="mshdr"><div class="mstit"><span class="mdot ${meal}"></span><span class="msname">${LBL[meal]}</span></div><span class="mskcal ${has?meal:''}">${has?mKcal+' kcal':''}</span></div>${items}</div>`;
  }).join('');
}

function setPeriod(n){ activePeriod=n; document.querySelectorAll('.ptab').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.p)===n)); renderHistory(); }

function renderHistory(){
  const dates=pastDates(activePeriod);
  const bd=byDate(entries);
  const today=todayStr();
  const yest=dStr(new Date(Date.now()-86400000));
  const withData=dates.filter(d=>bd[d]&&bd[d].length>0);
  const kcals=withData.map(d=>sumK(bd[d],'calories'));
  const avg=kcals.length?kcals.reduce((a,b)=>a+b,0)/kcals.length:0;
  const maxK=kcals.length?Math.max(...kcals):0;
  if(!withData.length){ document.getElementById('histCont').innerHTML=`<div class="nodata"><div class="ndi">📭</div><div class="ndt">No data for this period.<br>Start logging food today!</div></div>`; return; }
  const cDates=dates.slice(0,Math.min(14,activePeriod)).reverse();
  const cMax=Math.max(...cDates.map(d=>bd[d]?sumK(bd[d],'calories'):0),1);
  const bars=cDates.map(d=>{
    const kc=bd[d]?sumK(bd[d],'calories'):0;
    const pct=Math.max((kc/cMax)*100,kc>0?4:1);
    const lbl=new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'narrow'});
    return `<div class="bcol"><div class="bwrap"><div class="bfill${d===today?' today':''}" style="height:${pct}%" title="${Math.round(kc)} kcal"></div></div><div class="blbl">${lbl}</div></div>`;
  }).join('');
  const periodLabel=activePeriod===365?'Year':`${activePeriod} days`;
  const stats=`<div class="srow"><div class="sbox"><div class="sv">${fmtN(Math.round(avg))}</div><div class="sl">Avg kcal/day</div></div><div class="sbox"><div class="sv">${fmtN(Math.round(maxK))}</div><div class="sl">Peak day</div></div><div class="sbox"><div class="sv">${withData.length}</div><div class="sl">Days logged</div></div></div>`;
  const list=withData.map(d=>{
    const de=bd[d]; const kc=fmt(sumK(de,'calories'));
    const p=fmt(sumK(de,'protein')),f=fmt(sumK(de,'fat')),c=fmt(sumK(de,'carbs'));
    const tag=d===today?`<span class="htag today">Today</span>`:d===yest?`<span class="htag yesterday">Yesterday</span>`:'';
    return `<div class="hday"><div class="hd-hdr"><div class="hd-dt">${fmtDate(d)}${tag}</div><div class="hd-kc">${kc} kcal</div></div><div class="hd-mc">P ${p}g · F ${f}g · C ${c}g</div></div>`;
  }).join('');
  document.getElementById('histCont').innerHTML=`
    <div class="card"><div class="clabel">Calories — Last ${periodLabel}</div><div class="bchart">${bars}</div></div>
    <div class="card" style="padding-top:13px">${stats}<div class="div"></div>${list}</div>`;
}

function renderProjection(){
  const bd=byDate(entries); const all=Object.keys(bd);
  if(!all.length){ document.getElementById('projCont').innerHTML=`<div class="nodata" style="padding-top:60px"><div class="ndi">🔮</div><div class="ndt">Log at least one day of food<br>to see your forecast.</div></div>`; return; }
  const avgKcal=all.map(d=>sumK(bd[d],'calories')).reduce((a,b)=>a+b,0)/all.length;
  const avgP=all.map(d=>sumK(bd[d],'protein')).reduce((a,b)=>a+b,0)/all.length;
  const avgF=all.map(d=>sumK(bd[d],'fat')).reduce((a,b)=>a+b,0)/all.length;
  const avgC=all.map(d=>sumK(bd[d],'carbs')).reduce((a,b)=>a+b,0)/all.length;
  const yKcal=Math.round(avgKcal*365); const wKcal=Math.round(avgKcal*7); const mKcal=Math.round(avgKcal*30);
  const maint=2000; const diff=avgKcal-maint; const kgY=(diff*365)/7700;
  const kgAbs=Math.abs(kgY).toFixed(1); const dir=kgY>0?'gain':'lose'; const dirE=kgY>0?'📈':'📉';
  const pIns=avgP>=50?`Averaging <span class="ival">${fmt(avgP)}g protein/day</span> — great for muscle maintenance.`:`Averaging <span class="ival">${fmt(avgP)}g protein/day</span>. Most adults need 50–60g daily.`;
  const basis=all.length===1?'Based on 1 day logged':`Based on ${all.length} days logged`;
  document.getElementById('projCont').innerHTML=`
    <div class="phero"><div class="phlb">Projected yearly intake</div><div class="phvl">${(yKcal/1000).toFixed(0)}k<span class="phun">kcal / year</span></div><div class="phsb">${basis} · ~${Math.round(avgKcal).toLocaleString()} kcal/day average</div></div>
    <div class="pgrid">
      <div class="pstat"><div class="psl">Per Week</div><div class="psv">${(wKcal/1000).toFixed(1)}k <span class="psu">kcal</span></div></div>
      <div class="pstat"><div class="psl">Per Month</div><div class="psv">${(mKcal/1000).toFixed(1)}k <span class="psu">kcal</span></div></div>
      <div class="pstat"><div class="psl">Avg Protein/day</div><div class="psv">${fmt(avgP)} <span class="psu">g</span></div></div>
      <div class="pstat"><div class="psl">Avg Fat/day</div><div class="psv">${fmt(avgF)} <span class="psu">g</span></div></div>
    </div>
    <div class="icard"><div class="iico">${dirE}</div><div><div class="itit">Weight trend estimate</div><div class="ibod">At ~${Math.round(avgKcal)} kcal/day vs ~${maint} kcal maintenance, you may ${dir} roughly <span class="ival">${kgAbs} kg per year</span> if this continues. Real results vary by metabolism and activity.</div></div></div>
    <div class="icard"><div class="iico">🥩</div><div><div class="itit">Protein intake</div><div class="ibod">${pIns}</div></div></div>
    <div class="icard"><div class="iico">🍞</div><div><div class="itit">Carbohydrates</div><div class="ibod">Averaging <span class="ival">${fmt(avgC)}g carbs/day</span> — projects to <span class="ival">${Math.round(avgC*365/1000)}kg</span> of carbs over a year.</div></div></div>
    <div class="icard"><div class="iico">📅</div><div><div class="itit">Consistency</div><div class="ibod">You've logged <span class="ival">${all.length} day${all.length!==1?'s':''}</span>. The more you log, the more accurate your forecast becomes.</div></div></div>`;
}

// ── close search on outside click ──
document.addEventListener('click', e => {
  const sr = document.getElementById('searchResults');
  const sw = document.querySelector('.search-wrap');
  if(!sw.contains(e.target) && !sr.contains(e.target)) sr.classList.remove('show');
});

// ── init ──
const d=new Date();
document.getElementById('hdrDate').textContent=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
renderToday();
</script>
</body>
</html>
